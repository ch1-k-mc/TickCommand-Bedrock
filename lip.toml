format = 4
id = "github.com/ch1-k-mc/TickCommand-Bedrock"
version = "0.1.0"

[info]
name = "TickCommand"
description = "Adds the Java Edition /tick command to Bedrock Edition (LeviLamina), for clients and servers."
tags = ["platform:levilamina", "type:mod", "client", "server", "utility"]
logo = "https://raw.githubusercontent.com/ch1-k-mc/TickCommand-Bedrock/main/docs/images/icon.png"

# The default variant has an entry for each side: the server build for servers and the client
# build for clients, so the mod is installed as "<id>" on either side.

[[variants.""]]
side = "server"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/TickCommand-server-windows-x64.zip"]
place = [{ src = "TickCommand/", dest = "mods/TickCommand/" }]

[[variants.""]]
side = "client"
platform = "win-x64"

[variants."".deps]
# The bare id, not "#client": a lip.toml dependency is never rewritten, and lip.toml releases of
# LeviLamina have no "client" variant. The range starts above 26.60.6, the last tooth.json release,
# because the "" variant of a tooth.json release is the server build.
"github.com/LiteLDev/LeviLamina" = ">26.60.6 <26.61.0"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/TickCommand-client-windows-x64.zip"]
place = [{ src = "TickCommand/", dest = "mods/TickCommand/" }]
